# Jednorázově stáhne obrázky Instagram feedu z původního WordPressu.
name: Fetch Instagram images
on:
  push:
    paths: [".github/workflows/fetch-ig.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p assets/images/ig
          while read -r n media cdn; do
            [ -z "$n" ] && continue
            got=no
            for u in "https://radekrosastrong.cz/wp-content/uploads/sb-instagram-feed-images/${media}full.jpg" "https://radekrosastrong.cz/wp-content/uploads/sb-instagram-feed-images/${media}low.jpg" "$cdn"; do
              if curl -fsSL --max-time 60 -A "Mozilla/5.0" -o "assets/images/ig/$n.jpg" "$u"; then got=yes; echo "OK $n $u"; break; fi
            done
            [ $got = yes ] || echo "FAIL $n"
          done <<'LIST'
          01 346107469_1236124717036459_2995997854580225710_n https://scontent-prg1-1.cdninstagram.com/v/t51.36329-15/346107469_1236124717036459_2995997854580225710_n.jpg?_nc_cat=107&ccb=1-7&_nc_sid=8ae9d6&_nc_ohc=SyXaNKoC3MYAX80ICkV&_nc_ht=scontent-prg1-1.cdninstagram.com&edm=ANo9K5cEAAAA&oh=00_AfDpUfk_8Lq4hd-1-bvPuQyb7EyMZBsdo_CnHKdgEtmPxw&oe=64727727
