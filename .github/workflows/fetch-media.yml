# Jednorázově stáhne fotky a video z původního WordPressu do assets/images/.
name: Fetch media from WordPress
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/fetch-media.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download files
        run: |
          getent hosts radekrosastrong.cz || echo "DNS lookup failed for radekrosastrong.cz"
          getent hosts www.radekrosastrong.cz || echo "DNS lookup failed for www.radekrosastrong.cz"
          ok=0; fail=0
          while read -r path; do
            [ -z "$path" ] && continue
            name=$(basename "$path")
            got=no
            for base in https://radekrosastrong.cz http://radekrosastrong.cz https://www.radekrosastrong.cz; do
              if curl -fsSL --retry 3 --max-time 300 -A "Mozilla/5.0" -o "assets/images/$name" "$base/wp-content/uploads/$path"; then got=yes; break; fi
            done
            if [ "$got" = yes ]; then ok=$((ok+1)); echo "OK   $name ($(stat -c%s "assets/images/$name") B)"; else fail=$((fail+1)); rm -f "assets/images/$name"; echo "FAIL $path"; fi
          done <<'LIST'
          2024/03/7DE072D3-F686-4AF7-97A2-636A359C5991_4_5005_c-e1711030706673.jpeg
