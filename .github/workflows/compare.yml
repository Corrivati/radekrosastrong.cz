# Dočasné: snímky obrazovky starého (WordPress) a nového webu pro porovnání designu.
name: Compare design with WordPress
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/compare.yml"]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install Playwright
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Serve new site
        run: (python3 serve.py 8000 >/dev/null 2>&1 &) && sleep 2
      - name: Save live HTML and CSS
        run: |
          mkdir -p .compare/live-src
          for p in "" edukace onlinecoaching strangetraining strangetraining-old svalove-kontrakce kontrakce2 workshop-slachy webinar-zdarma gdpr obchodni-podminky; do
            n=${p:-home}
            curl -fsSL -A "Mozilla/5.0" "https://radekrosastrong.cz/$p${p:+/}" -o ".compare/live-src/$n.html" || echo "fail $p"
          done
          grep -ohE "https?://radekrosastrong\.cz/[^\"' )]+\.css[^\"' )]*" .compare/live-src/*.html | sed 's/&#038;/\&/g' | sort -u > .compare/live-src/css-urls.txt
          i=0; while read -r u; do i=$((i+1)); f=$(basename "${u%%\?*}"); curl -fsSL -A "Mozilla/5.0" "$u" -o ".compare/live-src/css-$i-$f" || echo "fail $u"; done < .compare/live-src/css-urls.txt
          ls -la .compare/live-src | head -80
      - name: Screenshots
        run: |
          cat > /tmp/pw/shot.js <<'JS'
          const { chromium } = require('playwright');
          const pages = ["", "edukace", "onlinecoaching", "strangetraining", "strangetraining-old", "svalove-kontrakce", "kontrakce2", "workshop-slachy", "webinar-zdarma", "gdpr", "obchodni-podminky"];
          const sites = { live: "https://radekrosastrong.cz/", new: "http://localhost:8000/" };
          (async () => {
            const b = await chromium.launch();
            for (const [w, h, tag] of [[1440, 900, "desktop"], [390, 844, "mobile"]]) {
              const ctx = await b.newContext({ viewport: { width: w, height: h }, deviceScaleFactor: 1, userAgent: tag === "mobile" ? "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1" : undefined, isMobile: tag === "mobile", hasTouch: tag === "mobile" });
              const p = await ctx.newPage();
              for (const [site, base] of Object.entries(sites)) {
                for (const pg of pages) {
                  try {
                    await p.goto(base + pg + (pg ? "/" : ""), { waitUntil: "networkidle", timeout: 60000 });
                  } catch (e) { console.log("goto", site, pg, e.message); }
                  await p.evaluate(async () => { for (let y = 0; y < document.body.scrollHeight; y += 500) { window.scrollTo(0, y); await new Promise(r => setTimeout(r, 120)); } window.scrollTo(0, 0); await new Promise(r => setTimeout(r, 800)); });
                  const name = `.compare/${tag}/${pg || "home"}-${site}`;
                  await p.screenshot({ path: name + "-top.jpg", type: "jpeg", quality: 70 });
                  await p.screenshot({ path: name + ".jpg", type: "jpeg", quality: 60, fullPage: true });
                }
              }
              await ctx.close();
            }
            await b.close();
          })();
          JS
          mkdir -p .compare/desktop .compare/mobile
          cd /tmp/pw && node shot.js
          ls -la $GITHUB_WORKSPACE/.compare/desktop | head
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add .compare
          git commit -m "Temporary design comparison screenshots" && git push
