# Dočasné: kontrola DNS záznamů domény.
name: DNS check
on:
  push:
    paths: [".github/workflows/dns-check.yml"]
jobs:
  dig:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y dnsutils >/dev/null 2>&1 || true
          echo "== NS"; dig +short NS radekrosastrong.cz
          for ns in $(dig +short NS radekrosastrong.cz) 1.1.1.1 8.8.8.8; do
            echo "== @$ns"
            for t in A AAAA; do echo "$t apex: $(dig +short $t radekrosastrong.cz @$ns | tr '\n' ' ')"; done
            echo "www: $(dig +short www.radekrosastrong.cz @$ns | tr '\n' ' ')"
            echo "CNAME www: $(dig +short CNAME www.radekrosastrong.cz @$ns | tr '\n' ' ')"
            echo "MX: $(dig +short MX radekrosastrong.cz @$ns | tr '\n' ' ')"
            echo "CAA: $(dig +short CAA radekrosastrong.cz @$ns | tr '\n' ' ')"
          done
          echo "== HTTP"; curl -sI http://radekrosastrong.cz/ | head -5; curl -sI http://www.radekrosastrong.cz/ | head -5
